name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.2"
      - run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check tools/ tests/
      - name: Lint
        run: uv run --locked ruff check tools/ tests/
      - name: Type check
        run: uv run --locked mypy tools/

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.2"
      - run: uv sync --locked
      - run: uv run --locked pytest tests/
